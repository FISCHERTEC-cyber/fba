name: FBA CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx tsc --noEmit

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Audit all locked production and development dependencies
        run: npm audit --audit-level=high

  secret-patterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan tracked index for high-confidence tokens
        run: python3 scripts/secret_pattern_scan.py
      - name: Scan complete fetched Git history
        env:
          SECURITY_REQUIRE_COMPLETE_HISTORY: '1'
        run: python3 scripts/secret_history_scan.py

  db-authorization-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fba_ci
          POSTGRES_PASSWORD: fba_ci_only
          POSTGRES_DB: fba_ci_isolated
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fba_ci -d fba_ci_isolated"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://fba_ci:fba_ci_only@localhost:5432/fba_ci_isolated?schema=public
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Install exact locked dependencies
        run: npm ci
      - name: Apply real Prisma migrations to fresh ephemeral PostgreSQL
        run: npx prisma migrate deploy
      - name: Prove user/wallet isolation, rejected writes, invitation rollback and session invalidation
        run: npm exec --yes --package=tsx@4.20.6 -- tsx --test tests/integration/database-authorization.test.ts
      - name: Test migration upgrade with existing synthetic data
        env:
          UPGRADE_DATABASE_URL: postgresql://fba_ci:fba_ci_only@localhost:5432/fba_ci_upgrade?schema=public
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" createdb -U fba_ci fba_ci_upgrade
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U fba_ci -d fba_ci_upgrade < prisma/migrations/20260904193000_init/migration.sql
          docker exec -i "$PG_CONTAINER" psql -v ON_ERROR_STOP=1 -U fba_ci -d fba_ci_upgrade <<'SQL'
          INSERT INTO "User" ("id", "email") VALUES ('upgrade-user', 'upgrade@example.invalid');
          INSERT INTO "Voucher" ("id", "userId", "merchantName", "title", "kind", "updatedAt")
          VALUES ('upgrade-voucher', 'upgrade-user', 'fixture', 'existing voucher', 'VALUE', CURRENT_TIMESTAMP);
          SQL
          DATABASE_URL="$UPGRADE_DATABASE_URL" npx prisma migrate resolve --applied 20260904193000_init
          DATABASE_URL="$UPGRADE_DATABASE_URL" npx prisma migrate deploy
          result=$(docker exec "$PG_CONTAINER" psql -At -U fba_ci -d fba_ci_upgrade -c 'SELECT "userId" || chr(124) || "title" FROM "Voucher" WHERE id = '\''upgrade-voucher'\''')
          test "$result" = 'upgrade-user|existing voucher'
