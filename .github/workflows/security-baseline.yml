name: FBA security baseline
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Audit production dependencies (release blocker)
        run: npm audit --omit=dev --audit-level=high
      - name: Audit all locked dependencies (including build and dev)
        if: always()
        run: npm audit --audit-level=high

  dependency-update-candidate:
    if: github.event_name == 'pull_request' && github.head_ref == 'security/toolkit-27-20261110' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate non-executing dependency update candidate
        run: |
          npm install next@15.5.29 --save-exact --package-lock-only --ignore-scripts --no-audit
          npm audit fix --package-lock-only --ignore-scripts || true
          node - <<'NODE'
          const fs = require('fs');
          for (const p of ['package.json', 'package-lock.json']) {
            console.log('FILE_START ' + p);
            const b64 = fs.readFileSync(p).toString('base64');
            for (let i=0;i<b64.length;i+=3000) console.log('FILE_CHUNK ' + b64.slice(i,i+3000));
            console.log('FILE_END ' + p);
          }
          NODE
