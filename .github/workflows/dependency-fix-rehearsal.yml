name: FBA major-upgrade isolated security rehearsal
on:
  pull_request:
    paths:
      - .github/workflows/dependency-fix-rehearsal.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare isolated major-upgrade candidate
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.dependencies.next='16.4.6';
          p.dependencies.zod='4.6.7';
          p.overrides={...(p.overrides||{}),'deepmerge-ts':'^8.0.0','postcss':'^8.5.32'};
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          JS
          npm install --package-lock-only --ignore-scripts --no-audit
          cp package.json candidate-package.json
          cp package-lock.json candidate-package-lock.json
      - name: Install and verify lockfile candidate
        run: npm ci
      - name: Regression tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Security audit (fail closed)
        run: npm audit --audit-level=high
      - name: Archive candidate for isolated review
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fba-major-candidate
          path: |
            candidate-package.json
            candidate-package-lock.json
          if-no-files-found: warn
          retention-days: 7
