name: Compatible dependency remediation rehearsal
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply only semver-compatible fixes to disposable runner lockfile
        shell: bash
        run: |
          set +e
          npm audit fix --package-lock-only > audit-fix-output.txt 2>&1
          rc=$?
          set -e
          printf 'audit_fix_exit=%s\n' "$rc" | tee candidate-status.txt
          cat audit-fix-output.txt
          cp package-lock.json candidate-package-lock.json
      - name: Install and verify resulting dependency graph
        run: npm ci
      - name: Regression tests
        run: npm test
      - name: Additional project regression
        run: npm run build
      - name: Re-audit candidate, fail on HIGH/CRITICAL
        run: npm audit --audit-level=high
      - name: Archive lockfile candidate even if unresolved findings remain
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: compatible-lock-candidate
          path: |
            candidate-package-lock.json
            candidate-status.txt
            audit-fix-output.txt
          if-no-files-found: warn
          retention-days: 7
